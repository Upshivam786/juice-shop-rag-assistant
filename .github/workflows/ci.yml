name: "CI/CD Pipeline"
on:
  push:
    branches-ignore:
      - l10n_develop
      - gh-pages
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'monitoring/grafana-dashboard.json'
      - 'screenshots/**'
    tags-ignore:
      - '*'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - 'data/static/i18n/*.json'
      - 'frontend/src/assets/i18n/*.json'

env:
  NODE_DEFAULT_VERSION: 24
  NODE_OPTIONS: "--max_old_space_size=4096"
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: "Use Node.js"
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: ${{ env.NODE_DEFAULT_VERSION }}
      - name: "Install application minimalistically"
        run: |
          npm install --ignore-scripts
          cd frontend
          npm install --ignore-scripts
      - name: "Lint source code"
        run: npm run lint

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: "Use Node.js"
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: ${{ env.NODE_DEFAULT_VERSION }}
      - name: "Install application"
        run: npm install
      - name: "Execute frontend unit tests"
        uses: nick-invision/retry@7152eba30c6575329ac0576536151aca5a72780e #v3.0.0
        with:
          shell: bash
          timeout_minutes: 10
          max_attempts: 3
          command: npm run test:frontend:coverage

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
      - name: "Use Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: "Install dependencies"
        run: pip install -r requirements.txt
      - name: "Run FastAPI RAG assistant test suite"
        run: pytest tests/ -v

  docker-compose-smoke:
    runs-on: ubuntu-latest
    needs: [python-tests]
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      - name: "Create .env for Docker Compose"
        run: |
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env
          echo "OPENROUTER_BASE_URL=https://openrouter.ai/api/v1" >> .env
          echo "MODEL_NAME=qwen/qwen3-8b" >> .env
          echo "INGEST_API_KEY=${{ secrets.INGEST_API_KEY }}" >> .env

      - name: "Build and start the RAG stack"
        run: docker compose -f docker-compose.rag.yml up -d --build

      - name: "Wait for assistant readiness"
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health/ready; then
              echo "Assistant is ready"
              exit 0
            fi
            echo "Waiting for assistant... ($i/30)"
            sleep 5
          done
          echo "Assistant never became ready"
          exit 1

      - name: "Smoke test: health endpoints"
        run: |
          curl -sf http://localhost:8000/health
          curl -sf http://localhost:8000/health/ready

      - name: "Smoke test: ingestion pipeline"
        run: |
          curl -sf -X POST http://localhost:8000/assistant/ingest \
            -H "X-API-Key: ${{ secrets.INGEST_API_KEY }}"

      - name: "Smoke test: OpenAI-compatible chat endpoint"
        run: |
          curl -sf -X POST http://localhost:8000/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{"model":"qwen/qwen3-8b","messages":[{"role":"user","content":"What juice do you have?"}],"stream":false}'

      - name: "Show logs on failure"
        if: failure()
        run: docker compose -f docker-compose.rag.yml logs

      - name: "Tear down"
        if: always()
        run: docker compose -f docker-compose.rag.yml down -v
